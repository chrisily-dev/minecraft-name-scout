name: Run Minecraft Name Scout

on:
  schedule:
    # Runs every 20 minutes
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      checks_per_run:
        description: "Names to check (use a small number for a smoke test)"
        required: false
        default: "80"

permissions:
  contents: write

concurrency:
  group: minecraft-name-scout
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Increased timeout to safely accommodate 80 requests

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check a paced candidate batch and send embeds
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_TAKEN: ${{ secrets.DISCORD_WEBHOOK_TAKEN }}
          CHECKS_PER_RUN: ${{ inputs.checks_per_run || '80' }}
          REQUEST_INTERVAL_SECONDS: "13"
        run: python bot.py

      - name: Persist the next-day retry queue
        if: always()
        run: |
          if git diff --quiet -- data/retry_queue.json; then
            echo "Retry queue is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/retry_queue.json
          git commit -m "Update name retry queue"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed the retry queue on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt. Rebasing onto origin/main."
            git fetch origin main
            if ! git rebase --strategy-option=theirs origin/main; then
              git rebase --abort
              echo "Could not rebase the retry queue onto origin/main."
              exit 1
            fi
          done

          echo "Could not push the retry queue after 5 attempts."
          exit 1
