name: Run Minecraft Name Scout

on:
  schedule:
    # Deliberately odd minutes. Everything scheduled on the hour or on a round
    # */N boundary lands in the same queue across all of GitHub, and the
    # overflow gets delayed or dropped. This is only a fallback anyway: the
    # chain step below is what normally starts the next run.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      checks_per_run:
        description: "Names to check (use a small number for a smoke test)"
        required: false
        default: "80"
      chain:
        description: "Re-trigger automatically when this run finishes"
        required: false
        default: "true"

permissions:
  contents: write
  actions: write

concurrency:
  group: minecraft-name-scout
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check a paced candidate batch and send embeds
        id: scan
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_TAKEN: ${{ secrets.DISCORD_WEBHOOK_TAKEN }}
          DISCORD_WEBHOOK_DELETING: ${{ secrets.DISCORD_WEBHOOK_DELETING }}
          DISCORD_WEBHOOK_SUSPENDED: ${{ secrets.DISCORD_WEBHOOK_SUSPENDED }}
          DISCORD_WEBHOOK_SUMMARY: ${{ secrets.DISCORD_WEBHOOK_SUMMARY }}
          CHECKS_PER_RUN: ${{ inputs.checks_per_run || '80' }}
          REQUEST_INTERVAL_SECONDS: "13"
        run: python bot.py

      - name: Persist the next-day retry queue
        if: always()
        run: |
          if git diff --quiet -- data/retry_queue.json; then
            echo "Retry queue is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/retry_queue.json
          git commit -m "Update name retry queue"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed the retry queue on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt. Rebasing onto origin/main."
            git fetch origin main
            if ! git rebase --strategy-option=theirs origin/main; then
              git rebase --abort
              echo "Could not rebase the retry queue onto origin/main."
              exit 1
            fi
          done

          echo "Could not push the retry queue after 5 attempts."
          exit 1

      # Start the next run instead of waiting for cron. GitHub treats scheduled
      # workflows as best effort and routinely delays or drops them, so a chain
      # is the only way to get a predictable cadence here.
      #
      # Deliberately gated on steps.scan.outcome rather than always(): if the
      # scan itself failed, the chain stops and the cron fallback restarts it
      # later. Otherwise a fast, repeatable failure would spin in a tight loop
      # and burn the whole Actions allowance in minutes.
      - name: Chain the next run
        if: ${{ steps.scan.outcome == 'success' && inputs.chain != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.CHAIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "CHAIN_TOKEN is not set, so this run will not chain."
            echo "Falling back to the cron schedule. See README for setup."
            exit 0
          fi

          # GITHUB_TOKEN cannot be used here: GitHub deliberately refuses to
          # start a workflow from an event raised by GITHUB_TOKEN, to stop
          # runaway recursion. A PAT is the supported way to opt in.
          # Deliberately does not forward checks_per_run. A smoke test run with
          # a small value would otherwise pin the chain to that value forever.
          # The next run always starts at the workflow default; change the
          # default here if a different sustained rate is wanted.
          if ! output=$(gh workflow run name-scout.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f chain=true 2>&1); then
            echo "$output"
            case "$output" in
              *403*|*"not accessible"*)
                echo "::error::CHAIN_TOKEN reached GitHub but was refused."
                echo "The token needs 'Actions: Read and write' on this repository."
                echo "Edit it at https://github.com/settings/personal-access-tokens"
                echo "  Repository access  -> Only select repositories -> this repo"
                echo "  Repository permissions -> Actions -> Read and write"
                ;;
              *404*)
                echo "::error::CHAIN_TOKEN cannot see this repository."
                echo "Under 'Repository access', select this repository explicitly."
                ;;
            esac
            exit 1
          fi

          echo "Queued the next run."
