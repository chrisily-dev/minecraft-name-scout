name: Run Minecraft Name Scout

on:
  schedule:
    # GitHub Actions' shortest supported schedule interval is five minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-name-scout
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check a paced candidate batch and send embeds
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CHECKS_PER_RUN: "20"
          REQUEST_INTERVAL_SECONDS: "13"
        run: python bot.py

      - name: Persist the next-day retry queue
        if: always()
        run: |
          if git diff --quiet -- data/retry_queue.json; then
            echo "Retry queue is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/retry_queue.json
          git commit -m "Update name retry queue"
          git push
